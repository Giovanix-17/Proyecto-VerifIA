# VerifIA — ejecución local del prototipo.
#   docker compose up --build
#   http://localhost:8000/health
# Fuente: VerifIA_memoria_proyecto.md §9 Fase 7, §15.1 #8 y #10.

name: verifia

services:
  verifia:
    build:
      context: .
      dockerfile: Dockerfile
    image: verifia:0.1.0
    container_name: verifia
    env_file:
      - .env
    # Solo accesible desde esta computadora: no se expone a la red local.
    ports:
      - "127.0.0.1:8000:8000"
    # Refuerza la regla 2: el contenedor no puede escribir nada permanente.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
